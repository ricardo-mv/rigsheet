<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0F10">
<title>RigSheet Mobile</title>
<style>
:root{
  color-scheme:light;
  --bg:#F3F3F1;--surf:#FFFFFF;--surf2:#E9E9E6;--line:#D6D6D1;
  --text:#16181A;--muted:#596067;--faint:#6E757C;
  --accent:#FFB224;--on-accent:#1A1300;--accent-text:#8A5A00;--accent-soft:#FFF0D2;
  --ok:#1E8E55;--bad:#C2362B;--violet:#6B4FD8;--violet-soft:#EEE9FF;--violet-text:#3E2C8A;
  --cyan:#0B6FA4;--cyan-soft:#E1F2FC;--coral:#B4472A;--coral-soft:#FCE8E1;--green-soft:#DFF5EA;
  --off:#B9BEC3;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E0F10;--surf:#181A1C;--surf2:#212427;--line:#2C3034;
    --text:#EDEEF0;--muted:#A1A7AD;--faint:#8A9198;
    --accent-text:#FFB224;--accent-soft:#2A2412;
    --ok:#3DD68C;--bad:#FF6B5E;--violet:#B49CFF;--violet-soft:#221C3A;--violet-text:#E4DCFF;
    --cyan:#4CC3FF;--cyan-soft:#10283A;--coral:#FF8A65;--coral-soft:#33201A;--green-soft:#0F2A1E;
    --off:#4A5056;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E0F10;--surf:#181A1C;--surf2:#212427;--line:#2C3034;
  --text:#EDEEF0;--muted:#A1A7AD;--faint:#8A9198;
  --accent-text:#FFB224;--accent-soft:#2A2412;
  --ok:#3DD68C;--bad:#FF6B5E;--violet:#B49CFF;--violet-soft:#221C3A;--violet-text:#E4DCFF;
  --cyan:#4CC3FF;--cyan-soft:#10283A;--coral:#FF8A65;--coral-soft:#33201A;--green-soft:#0F2A1E;
  --off:#4A5056;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;padding:0}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono)}
.app{max-width:520px;margin:0 auto;padding:0 0 calc(96px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 20px 10px}
.brand{font-weight:700;letter-spacing:4px;font-size:14px;font-family:var(--mono)}
.pill{display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--line);background:var(--surf);font-size:12px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:4px;background:var(--off);display:inline-block;flex-shrink:0}
.dot.on{background:var(--ok)}
.status{margin:0 20px 6px;font-size:12px;color:var(--muted);min-height:16px}
h1{margin:4px 20px 0;font-size:32px;font-weight:700;letter-spacing:-.5px}
.sub{margin:4px 20px 0;font-size:12px;color:var(--muted);font-family:var(--mono)}
.section{padding:20px 20px 8px;font-size:13px;font-weight:600;color:var(--muted)}
.card{margin:0 16px;border-radius:20px;background:var(--surf);border:1px solid var(--line)}
.btn{min-height:48px;padding:0 16px;border-radius:15px;font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-ghost{background:var(--surf2);border:1px solid var(--line)}
.btn-danger{background:transparent;border:1px solid var(--bad);color:var(--bad)}
.sq{width:44px;height:44px;border-radius:14px;background:var(--surf2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px 4px}
.chips::-webkit-scrollbar{display:none}
.chip{height:34px;flex-shrink:0;padding:0 14px;border-radius:17px;border:1px solid var(--line);background:var(--surf);font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.search{display:flex;gap:8px;padding:14px 16px 0}
.search label{flex:1;height:48px;border-radius:15px;background:var(--surf);border:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 14px;color:var(--muted)}
.search input{flex:1;min-width:0;border:none;outline:none;background:transparent;color:var(--text);font-size:16px}
.search input::placeholder,textarea::placeholder,.field input::placeholder{color:var(--faint)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.slot{min-width:54px;height:36px;padding:0 6px;border-radius:10px;background:var(--surf2);font-family:var(--mono);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.slot.on{background:var(--accent);color:var(--on-accent)}
.list{margin:0 16px;border-radius:18px;background:var(--surf);border:1px solid var(--line);overflow:hidden}
.row{width:100%;min-height:62px;display:flex;align-items:center;gap:12px;padding:10px 14px;text-align:left;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .n{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .m{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{height:20px;padding:0 7px;border-radius:10px;font-size:11px;font-weight:600;display:inline-flex;align-items:center;white-space:nowrap}
.badge.dirty{background:var(--accent-soft);color:var(--accent-text)}
.badge.live{background:var(--green-soft);color:var(--ok)}
.badge.warn{background:var(--coral-soft);color:var(--coral)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding:6px 8px calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
.tabbar .in{display:flex;justify-content:space-around;width:100%;max-width:520px}
.tab{width:68px;height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;color:var(--muted);border-radius:14px;position:relative}
.tab[aria-current="page"]{color:var(--accent-text);font-weight:600}
.tab .cnt{position:absolute;top:2px;right:14px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
.lcd{font-size:46px;font-weight:700;color:var(--accent-text);line-height:1;font-family:var(--mono)}
.blocks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:0 16px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.blk{height:64px;padding:9px 10px;border-radius:14px;border:1px solid var(--line);background:var(--surf);display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;touch-action:manipulation;transition:transform .12s}
.blk:active{transform:scale(.96)}
.blk[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.blk.bad{border-color:var(--bad)}
.blk .c{display:flex;justify-content:space-between;align-items:center;width:100%;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:1px}
.blk .md{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}
.blk.isoff .md{color:var(--faint)}
.st{font-size:9px;font-weight:700;letter-spacing:.5px;padding:2px 5px;border-radius:6px;background:var(--surf2);color:var(--faint)}
.st.on{background:var(--accent);color:var(--on-accent)}
body.notitles h1,body.notitles .sub{display:none}
body.notitles .tophead{display:none}
.metarow{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
.volc{display:inline-flex;align-items:center;gap:2px;height:34px;border-radius:17px;border:1px solid var(--line);background:var(--surf2);padding:0 3px 0 10px;margin-left:auto}
.volc .vl{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.5px;margin-right:4px}
.volc button{width:30px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.volc button:active{background:var(--line)}
.volc b{min-width:30px;text-align:center;font-size:15px;color:var(--accent-text)}
.ctrlb{border-style:dashed}
.vol{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.vol .vl{flex:1;font-size:13px;color:var(--muted)}
.vol .vv{min-width:44px;text-align:center;font-size:22px;font-weight:700;color:var(--accent-text)}
.vol .sq{width:48px;height:48px;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.eq{display:grid;gap:2px;margin-top:4px}
.eqb{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.eqb .pv{font-size:10px;text-align:center}
.eqb label{font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
input[type=range].vert{writing-mode:vertical-lr;direction:rtl;width:28px;height:150px;margin:0}
.seg{display:flex;margin:12px 16px 0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surf)}
.seg button{flex:1;height:40px;font-size:13px;display:flex;align-items:center;justify-content:center;gap:4px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:600}
.parts{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.parts .btn{min-height:46px;font-family:var(--mono)}
.mini{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.minib{height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surf2);color:var(--muted);font-family:var(--mono);font-size:11px;font-weight:700}
.minib.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text)}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.slotin{position:relative;display:block}
.slotin span{position:absolute;left:8px;top:4px;font-size:10px;color:var(--faint)}
.slotin input{width:100%;height:50px;border-radius:12px;border:1px solid var(--line);background:var(--surf2);padding:12px 6px 0;font-size:16px;text-align:center;font-family:var(--mono);color:var(--text)}
.help{margin:0 16px 8px;border-radius:16px;background:var(--surf);border:1px solid var(--line)}
.help summary{padding:14px 16px;font-weight:600;cursor:pointer;list-style-position:inside}
.help div{padding:0 16px 8px;font-size:14px;line-height:1.55;color:var(--muted)}
.help b{color:var(--text)}
.param{display:grid;grid-template-columns:minmax(78px,30%) 1fr 64px;align-items:center;gap:10px;min-height:40px}
.param .pn{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.param .pv{font-family:var(--mono);font-size:13px;text-align:right;white-space:nowrap}
.param select,.selectfull{grid-column:2 / 4;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surf2);padding:0 10px;font-size:15px;width:100%}
input[type=range]{width:100%;height:32px;accent-color:var(--accent);background:transparent}
.switch{width:52px;height:30px;border-radius:15px;background:var(--off);position:relative;flex-shrink:0;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:12px;background:#fff;transition:transform .15s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(22px)}
.tag{height:24px;padding:0 10px;border-radius:12px;background:var(--surf2);color:var(--muted);font-size:12px;display:inline-flex;align-items:center}
.tune{height:24px;padding:0 9px;border-radius:8px;background:var(--surf2);font-family:var(--mono);font-size:11px;font-weight:600;display:flex;align-items:center;white-space:nowrap}
.song{margin:0 16px 8px;border-radius:18px;background:var(--surf);border:1px solid var(--line);overflow:hidden}
.song.open{border-color:var(--accent)}
.song>button{width:100%;text-align:left;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.minislot{height:22px;padding:0 7px;border-radius:7px;background:var(--accent-soft);color:var(--accent-text);font-family:var(--mono);font-size:11px;font-weight:700;display:inline-flex;align-items:center}
.minislot.none{background:transparent;border:1px dashed var(--off);color:var(--muted);font-family:inherit;font-weight:400}
.note{border-radius:12px;background:var(--violet-soft);color:var(--violet-text);padding:10px 12px;font-size:14px;line-height:1.45;display:flex;gap:8px;white-space:pre-wrap}
textarea{width:100%;min-height:76px;border-radius:12px;border:1px solid var(--line);background:var(--surf2);color:var(--text);font-size:16px;padding:10px 12px;resize:vertical}
.apps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));row-gap:18px;column-gap:8px;padding:0 16px}
.app-i{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;text-align:center;line-height:1.2}
.app-i .ic{width:62px;height:62px;border-radius:20px;display:flex;align-items:center;justify-content:center}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:12px 16px 0}
.stat{height:66px;border-radius:16px;background:var(--surf);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.stat b{font-family:var(--mono);font-size:18px}
.stat span{font-size:11px;color:var(--muted)}
.empty{margin:24px 16px;text-align:center;color:var(--muted);font-size:14px;line-height:1.5}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(12px);opacity:0;pointer-events:none;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:13px;font-weight:500;transition:opacity .2s,transform .2s;z-index:30;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:88vh;overflow-y:auto;background:var(--surf);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.field input,.field select{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surf2);padding:0 12px;font-size:16px;color:var(--text)}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.foot{margin:18px 16px 0;font-size:11px;color:var(--faint);text-align:center;line-height:1.5}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>

/* Cambio de programa con banco. El motor toma solo el número de programa
   (0–127), así que los slots 33-A en adelante caían en otro banco: 36-B se
   leía como 04-B. Aquí se combina con el CC0 (banco) y, si el pedal solo
   devuelve el programa, se respeta el slot que acabamos de pedir. */
let BANKMSB=0,PEDIDO={sn:null,t:0};
const _irAlPreset=irAlPreset;
irAlPreset=function(sn){PEDIDO={sn,t:Date.now()};_irAlPreset(sn);};
function rxEntraM(ev){
  const dd=ev.data;
  if((dd[0]&0xF0)===0xB0&&dd[1]===0){BANKMSB=dd[2];return}
  if((dd[0]&0xF0)===0xC0){
    let sn;
    if(PEDIDO.sn&&Date.now()-PEDIDO.t<2000&&(idxSlot(PEDIDO.sn)&0x7F)===dd[1])sn=PEDIDO.sn;
    else{const i=BANKMSB*128+dd[1];if(i>255)return;sn=slotIdx(i);}
    USB.activo=sn;usbPintar();return;
  }
  rxEntra(ev);
}

/* ── USB: conectar, traer, guardar (protocolo idéntico al de escritorio) ── */
function usbDesconectar(){
  const suc=dirtyN();
  if(suc&&!confirm("Hay "+suc+" preset(s) con cambios sin guardar en el pedal. Se conservan aquí, pero ¿desconectar igual?"))return;
  if(JOB){clearInterval(JOB);JOB=null}
  CORTA=true;
  if(USB.midi){USB.midi.inputs.forEach(p=>{p.onmidimessage=null})}
  USB.midi=null;USB.out=null;USB.on=false;USB.activo=null;
  usbPintar();
}
function usbConectar(){
  if(!navigator.requestMIDIAccess){alert("Este navegador no tiene Web MIDI. Usa Chrome en Android (o Chrome/Edge en el computador). En iPhone solo puedes trabajar con archivos .prst.");return}
  navigator.requestMIDIAccess({sysex:true}).then(a=>{
    USB.midi=a;USB.out=null;
    a.outputs.forEach(p=>{if(!USB.out)USB.out=p});
    a.inputs.forEach(p=>{p.onmidimessage=rxEntraM});
    if(!USB.out){alert("No aparece ningún pedal. Revisa el cable USB (en el teléfono, un adaptador OTG) y que el pedal esté encendido.");return}
    const detectado=/\bLT\b|GP-?200\s*LT/i.test(USB.out.name||"")?"lt":"gp200";
    if(detectado!==EQUIPO){EQUIPO=detectado;try{localStorage.setItem("rs_dev",EQUIPO)}catch(e){};armarBymod();
      alert("Pedal detectado: "+EQUIPOS[EQUIPO].n+" ("+(USB.out.name||"—")+").");}
    USB.on=true;usbPintar();usbTraer();
  }).catch(e=>alert("Sin permiso MIDI: "+e.message));
}
function usbTraer(){
  if(PRESETS.length&&PRESETS.some(p=>p.dirty)&&!confirm("Traer los presets del pedal reemplaza los cambios que no has guardado. ¿Seguir?"))return;
  RX={};ARM=null;CORTA=false;
  let i=0,espera=0;
  usbEnviar(HOLA);
  usbPintar("Trayendo presets del pedal…");
  JOB=setInterval(()=>{
    if(CORTA||i>255){
      clearInterval(JOB);JOB=null;rxCerrar(ARM);ARM=null;
      const ks=Object.keys(RX).map(Number).sort((x,y)=>x-y);
      if(!ks.length){usbPintar();alert("El pedal no respondió. Desconecta, vuelve a enchufar el cable e inténtalo otra vez.");return}
      PRESETS=ks.map(k=>{
        const b=RX[k];let nom="";
        for(let q=68;q<84&&b[q];q++)nom+=String.fromCharCode(b[q]);
        const limpio=nom.trim().replace(/[^A-Za-z0-9]+/g,"_");
        return parse(b.buffer.slice(0),slotIdx(k)+(limpio?"_"+limpio:"")+".prst");
      });
      CUR=Math.max(0,PRESETS.findIndex(p=>p.slot===USB.activo));
      usbPintar();toast(PRESETS.length+" presets traídos del pedal");
      return;
    }
    if(RX[i]!==undefined){i++;espera=0;usbPintar("Trayendo presets… "+Object.keys(RX).length+"/256");return}
    if(espera===0)usbEnviar(pedirPreset(i));
    if(++espera>14){i++;espera=0}
  },30);
}
function usbGuardar(){
  if(!USB.on){alert("Conecta el pedal para guardar en su memoria. Sin pedal puedes descargar los cambios como ZIP.");return}
  const pend=PRESETS.filter(p=>p.dirty&&idxSlot(p.slot)>=0).map(p=>({slot:idxSlot(p.slot),p,nuevo:buildPrst(p),viejo:new Uint8Array(p.raw),destino:p.slot}));
  if(!pend.length){toast("No hay cambios para guardar");return}
  const conMalos=pend.filter(x=>malos(x.p).length);
  if(conMalos.length){alert("Estos presets tienen un modelo en un bloque que no lo acepta; el pedal los dejaría mudos. Corrígelos antes de guardar:\n\n"+conMalos.slice(0,10).map(x=>"  "+x.destino+"  "+x.p.name+" — "+malos(x.p).join(", ")).join("\n"));return}
  if(!confirm("Guardar "+pend.length+" preset(s) en la memoria del pedal:\n\n"+pend.slice(0,10).map(x=>"  "+x.destino+"  "+x.p.name).join("\n")+(pend.length>10?"\n  …":"")))return;
  if(confirm("¿Descargar primero un respaldo de esos slots tal como están ahora en el pedal?")){
    try{save(zip(pend.map(x=>({name:x.p.slot+"_antes.prst",data:x.viejo}))),stamp()+"_respaldo-antes-de-guardar.zip");}
    catch(e){if(!confirm("No se pudo crear el respaldo. ¿Guardar igual?"))return}
    if(!confirm("Cuando termine la descarga del respaldo, toca Aceptar para escribir en el pedal."))return;
  }
  CORTA=false;let k=0,ok=0;
  (function paso(){
    if(CORTA||k>=pend.length){usbPintar();alert("Guardados y verificados: "+ok+" de "+pend.length+".");return}
    const x=pend[k];
    usbPintar("Guardando "+x.p.slot+"…");
    const ms=msgGuardar(x.nuevo,x.slot);let j=0;
    const iv=setInterval(()=>{
      if(j>=ms.length){
        clearInterval(iv);
        setTimeout(()=>{
          delete RX[x.slot];ARM=null;
          let esp=0;
          const rev=setInterval(()=>{
            if(RX[x.slot]!==undefined){
              clearInterval(rev);
              const des=RX[x.slot],e2=x.nuevo.slice();
              e2[52]=des[52];e2[144]=des[144];
              for(let q=0;q<8;q++){e2[1120+q*12+6]=des[1120+q*12+6];e2[1120+q*12+7]=des[1120+q*12+7]}
              let s3=0;for(let q=0;q<0x4C6;q++)s3=(s3+e2[q])&0xFFFF;
              e2[0x4C6]=(s3>>8)&0xFF;e2[0x4C7]=s3&0xFF;
              const dif=[];for(let q=46;q<1216;q++)if(e2[q]!==des[q])dif.push(q);
              if(dif.length){CORTA=true;
                alert("No se pudo verificar "+x.p.slot+": "+dif.length+" byte(s) distintos.\n\n"+dif.slice(0,8).map(q=>"@"+q+": esperaba "+e2[q]+", había "+des[q]).join("\n"));}
              else{ok++;x.p.raw=des.buffer.slice(0);x.p.dirty=false;}
              k++;setTimeout(paso,60);return;
            }
            if(esp===0)usbEnviar(pedirPreset(x.slot));
            if(++esp>20){clearInterval(rev);CORTA=true;alert("No se pudo verificar "+x.p.slot+": el pedal no respondió.");k++;setTimeout(paso,60)}
          },30);
        },350);
        return;
      }
      if(!usbEnviar(ms[j])){clearInterval(iv);CORTA=true;paso();return}
      j++;
    },40);
  })();
}
function descartar(p){
  const fresh=parse(p.raw,p.file);fresh.slot=p.slot;
  const i=PRESETS.indexOf(p);PRESETS[i]=fresh;
  if(USB.on&&fresh.slot===USB.activo)recargarPedal(fresh.slot);
}

const normSlot=(v,col)=>{v=String(v||"").trim().toUpperCase().replace(/\s+/g,"");
  if(!v)return "";
  let m=v.match(/^(\d{1,2})[-_]?([A-D])$/); if(m)return m[1].padStart(2,"0")+"-"+m[2];
  m=v.match(/^(\d{1,2})$/); if(m&&col&&"ABCD".includes(col))return m[1].padStart(2,"0")+"-"+col;
  return v;};
function parseCSV(txt){
  txt=txt.replace(/^\uFEFF/,"");
  const first=txt.split(/\r?\n/)[0]||"", sep=(first.split(";").length>first.split(",").length)?";":",";
  const rows=[];let row=[],cell="",q=false;
  for(let i=0;i<txt.length;i++){const c=txt[i];
    if(q){if(c==='"'){if(txt[i+1]==='"'){cell+='"';i++}else q=false}else cell+=c}
    else if(c==='"')q=true; else if(c===sep){row.push(cell);cell=""}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&txt[i+1]==="\n")i++;row.push(cell);rows.push(row);row=[];cell=""}
    else cell+=c;}
  if(cell!==""||row.length){row.push(cell);rows.push(row)}
  return rows.filter(r=>r.some(x=>String(x).trim()!==""));
}
const letra=k=>k<26?String.fromCharCode(65+k):"P"+(k+1);
function importarTemas(txt){
  const rows=parseCSV(txt); if(rows.length<2){toast("El CSV no tiene filas");return}
  const n=s=>String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"");
  const h=rows[0].map(n), col=ks=>h.findIndex(x=>ks.includes(x));
  const ix={id:col(["id"]),artista:col(["artista","artist"]),cancion:col(["cancion","song","tema"]),afinacion:col(["afinacion","tuning"]),
    preset:col(["preset"]),obs:col(["obs","observaciones","nota","notas"]),tags:col(["etiquetas","tags"])};
  /* columnas de slot: "Slot A", "Slot B"… o solo "A", "B"… en cualquier cantidad */
  const sc=[];h.forEach((x,c)=>{const m=x.match(/^(?:slot|parte)?([a-z])$/);if(m&&c!==ix.id)sc.push({c,L:m[1].toUpperCase()})});
  sc.sort((a,b)=>a.L.localeCompare(b.L));
  if(ix.cancion<0){toast("Falta la columna Canción");return}
  const g=(r,k)=>ix[k]>=0?String(r[ix[k]]||"").trim():"";
  const nuevos=rows.slice(1).map((r,i)=>{
    const slots=sc.map(s=>normSlot(r[s.c],s.L));while(slots.length&&!slots[slots.length-1])slots.pop();
    return {id:g(r,"id")||"T"+String(i+1).padStart(4,"0"),artista:g(r,"artista"),cancion:g(r,"cancion"),afinacion:g(r,"afinacion"),preset:g(r,"preset"),slots,obs:g(r,"obs"),tags:g(r,"tags")};

  if(!confirm("Importar "+nuevos.length+" canciones. Esto reemplaza el repertorio actual ("+TEMAS.length+"). ¿Seguir?"))return;

/* ── afinación virtual: un ajuste de Hammy guardado por afinación ── */
let AFV={};
try{const s=localStorage.getItem("rs_afv");if(s)AFV=JSON.parse(s)||{};}catch(e){}

const afvDe=a=>{if(!a)return null;const k=Object.keys(AFV).find(x=>x.toLowerCase()===String(a).toLowerCase().trim());return k?AFV[k]:null};
function aplicarAfv(a,slots){
  const m=afvDe(a);if(!m)return 0;let n=0,mudo=0;
  slots.filter(Boolean).forEach(sn=>{
    const p=PRESETS.find(x=>x.slot===sn);if(!p)return;
    const b=p.blocks.find(x=>x.mod===m.mod);if(!b||!CAT[m.mod]||!CAT[m.mod].has(m.code))return;
    const cambiaModelo=b.code!==m.code;
    b.code=m.code;b.fx=FX[String(m.code)]||null;b.vals=m.vals.slice(0,15);b.on=true;p.dirty=true;n++;
    if(esActivo(p)){aplicarBloque(p,b.mod,true);if(b.fx)b.fx.p.forEach(d=>aplicarParam(p,b.mod,d.i,b.vals[d.i]));if(cambiaModelo)mudo++;}
  });
  return n;
}

  const items=PRESETS.map((p,i)=>({p,i})).filter(({p})=>{
    if(S.pchip==="Con autor"&&p.kind!=="mio")return false;

    return (p.slot+" "+p.name+" "+p.author+" "+p.note+" "+getNote(p)+" "+styleName(p.style)+" "+fx+" "+temaDe(p.slot).join(" ")).toLowerCase().includes(q);
  });
  if(!items.length)return h+'<div class="empty">Ningún preset coincide. Prueba con el nombre, el slot (39-B) o un efecto (UK 800).</div>';
  const banks={},order=[];

  const lim=q||S.pchip!=="Todos"?999:80; let shown=0;

        (o.p.dirty?'<span class="badge dirty">editado</span>':'')+(getNote(o.p)?'<span style="color:var(--violet);display:flex">'+ic('note',18)+'</span>':'')+'</button>';
    }

  }

}

const TORD=["standard","eb standard","d standard","standard c#","std c#","c# standard","c standard","b standard","drop d","drop c#","drop db","drop c","drop b","drop a#","drop a"];
const tRank=a=>{const k=TORD.indexOf(String(a).toLowerCase().trim());return k<0?100:k};
function ordenTemas(){
  const idx=TEMAS.map((_,i)=>i), c=(x,y)=>String(x||"").localeCompare(String(y||""),"es",{sensitivity:"base"});
  if(S.tsort==="aleatorio"){
    if(!S.shuf||S.shuf.length!==TEMAS.length){S.shuf=idx.slice();for(let i=S.shuf.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[S.shuf[i],S.shuf[j]]=[S.shuf[j],S.shuf[i]]}}
    return S.shuf;
  }
  if(S.tsort==="artista")return idx.sort((a,b)=>c(TEMAS[a].artista,TEMAS[b].artista)||c(TEMAS[a].cancion,TEMAS[b].cancion));
  return idx.sort((a,b)=>c(TEMAS[a].cancion,TEMAS[b].cancion));
}

function guardarHoja(i){
  const sh=$("sheet"), g=k=>{const el=sh.querySelector('[data-f="'+k+'"]');return el?el.value.trim():""};
  const slots=[...sh.querySelectorAll('[data-slot]')].map((el,k)=>normSlot(el.value,letra(k).length===1?letra(k):""));
  while(slots.length&&!slots[slots.length-1])slots.pop();
  const bad=slots.filter(s=>s&&!/^(0[1-9]|[1-5]\d|6[0-4])-[A-D]$/.test(s));
  if(!g("cancion")){toast("Falta el nombre de la canción");return}
  if(bad.length){toast("Slot inválido: "+bad.join(", ")+". Usa 01-A a 64-D");return}
  const t={id:i>=0?TEMAS[i].id:"T"+String(Date.now()).slice(-6),artista:g("artista"),cancion:g("cancion"),afinacion:g("afinacion"),preset:g("preset"),slots,obs:g("obs"),tags:g("tags")};
  if(i>=0)TEMAS[i]=t; else {TEMAS.push(t);S.open=TEMAS.length-1;S.shuf=null;}
  guardarTemas();sh.innerHTML="";
  if(afvDe(t.afinacion)&&t.slots.some(s=>PRESETS.some(p=>p.slot===s))&&confirm("Tienes una afinación virtual para «"+t.afinacion+"». ¿Ponerla en los presets de esta canción?")){

  render(true);
}

  const r=route(),v=$("view"),a=document.activeElement,fid=a&&a.id,pos=a&&a.selectionStart;
  const y=window.scrollY;
  v.innerHTML=r==="pedal"?vPedal():r==="presets"?vPresets():r==="repertorio"?vTemas():r==="ayuda"?vAyuda():vInicio();
  tabs();
  if(keep){window.scrollTo(0,y);if(fid){const el=$(fid);if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(e){}}}}
  if(S.editNote){const t=$("cmt");if(t)t.focus();}
}

/* ── interacción ── */
function paso1(d){if(!PRESETS.length)return;CUR=(CUR+d+PRESETS.length)%PRESETS.length;S.editNote=false;if(USB.on)irAlPreset(PRESETS[CUR].slot);render(true);}
function toggleBloque(mod){const p=PRESETS[CUR];if(!p)return;const b=p.blocks.find(x=>x.mod===mod);if(!b)return;
  b.on=!b.on;p.dirty=true;SELB=mod;aplicarBloque(p,b.mod,b.on);render(true);if(navigator.vibrate)navigator.vibrate(15);}

let volT=null,volI=null,volUsado=false;
function volFin(){if(volT||volI){clearTimeout(volT);clearInterval(volI);volT=volI=null;render(true);}}
document.addEventListener("pointerdown",e=>{const b=e.target.closest("[data-vol]");if(!b)return;
  e.preventDefault();volUsado=true;const d=+b.dataset.vol;pasoVol(d);
  volT=setTimeout(()=>{volI=setInterval(()=>pasoVol(d),90)},420);});
["pointerup","pointercancel","pointerleave"].forEach(t=>document.addEventListener(t,volFin));
let lpT=null,lpFired=false;
document.addEventListener("pointerdown",e=>{const b=e.target.closest("[data-blk]");if(!b)return;lpFired=false;clearTimeout(lpT);lpT=setTimeout(()=>{lpFired=true;toggleBloque(b.dataset.blk)},480)});
["pointerup","pointercancel","pointerleave","pointermove"].forEach(t=>document.addEventListener(t,e=>{if(t!=="pointermove"||Math.abs(e.movementY||0)>4)clearTimeout(lpT)}));
document.addEventListener("contextmenu",e=>{if(e.target.closest("[data-blk]"))e.preventDefault()});

document.addEventListener("click",e=>{
  if(e.target.classList&&e.target.classList.contains("sheet-bg")){$("sheet").innerHTML="";return}
  const t=e.target.closest("button");if(!t)return;
  const d=t.dataset;
  if(t.id==="conn"){USB.on?usbDesconectar():usbConectar();return}
  if(d.vol){if(volUsado&&e.detail!==0){volUsado=false;return}volUsado=false;pasoVol(+d.vol);render(true);return}
  if(d.blk){if(lpFired){lpFired=false;return}SELB=d.blk;render(true);return}
  if(d.go){go(d.go);return}
  if(t.id==="btnBuscar"){hojaBuscar();return}
  if(d.pick){elegirPreset(+d.pick);go("pedal");return}
  if(d.qpick){elegirPreset(+d.qpick);$("sheet").innerHTML="";if(route()!=="pedal")go("pedal");else render();return}
  if(d.ctrl!==undefined){const p=PRESETS[CUR];if(p){const c=+d.ctrl,k=+d.bit;p.ctrl[c]=(p.ctrl[c]>>k&1)?(p.ctrl[c]&~(1<<k))>>>0:(p.ctrl[c]|(1<<k))>>>0;p.dirty=true;render(true);}return}
  if(d.delafv){delete AFV[d.delafv];guardarAfv();hojaAfv();return}
  if(d.afvapply!==undefined){const tm=TEMAS[+d.afvapply];const n=aplicarAfv(tm.afinacion,tm.slots);render(true);toast(n?"Afinación "+tm.afinacion+" aplicada a "+n+" preset(s). Guarda en el pedal para dejarla fija":"Esos slots no están cargados");return}
  if(d.pchip){S.pchip=d.pchip;render();return}
  if(d.tune){S.tune=d.tune;S.open=-1;render();return}
  if(d.song!==undefined){const i=+d.song;S.open=S.open===i?-1:i;render(true);return}
  if(d.load){cargarSlot(d.load);return}
  if(d.tsort){if(d.tsort==="aleatorio")S.shuf=null;S.tsort=d.tsort;render(true);return}
  if(d.mtog){const k=PRESETS.findIndex(pp=>pp.slot===curSlot());if(k>=0){CUR=k;toggleBloque(d.mtog);}return}
  if(d.edit!==undefined){hojaTema(+d.edit);return}
  if(d.savetema!==undefined){guardarHoja(+d.savetema);return}
  if(d.deltema!==undefined){const i=+d.deltema;if(confirm("¿Eliminar «"+TEMAS[i].cancion+"» del repertorio?")){TEMAS.splice(i,1);S.open=-1;guardarTemas();$("sheet").innerHTML="";render();}return}
  const p=PRESETS[CUR];
  switch(d.act){
    case "connect":USB.on?usbDesconectar():usbConectar();break;
    case "reload":USB.on?usbTraer():toast("Conecta el pedal primero");break;
    case "open":$("filePrst").click();break;
    case "search":S.pchip="Todos";go("presets");setTimeout(()=>{const el=$("pq");if(el)el.focus()},60);break;
    case "prev":paso1(-1);break;
    case "next":paso1(1);break;
    case "loadCur":if(p)irAlPreset(p.slot);break;
    case "toggleSel":toggleBloque(SELB);break;
    case "saveAll":usbGuardar();break;
    case "zipDirty":exportarZip(true);break;
    case "zipAll":exportarZip(false);break;
    case "discardCur":if(p&&p.dirty&&confirm("¿Descartar los cambios de "+p.slot+"?")){descartar(p);render(true);toast("Cambios descartados");}break;
    case "discardAll":{const n=dirtyN();if(!n){toast("No hay cambios");break}if(confirm("¿Descartar los cambios de "+n+" preset(s)?")){PRESETS.filter(x=>x.dirty).forEach(descartar);render();toast("Cambios descartados");}break}
    case "noteEdit":S.editNote=true;render(true);break;
    case "noteCancel":S.editNote=false;render(true);break;
    case "noteSave":{const ta=$("cmt");if(p&&ta)setNote(p,ta.value.trim());S.editNote=false;render(true);toast("Comentario guardado en este teléfono");break}
    case "csvIn":$("fileCsv").click();break;
    case "csvOut":exportarTemas();break;
    case "zipFull":exportarTodo();break;
    case "jsonIn":$("fileJson").click();break;
    case "addTema":hojaTema(-1);break;
    case "addPart":{const box=$("slotsBox"),k=box.querySelectorAll("[data-slot]").length;box.insertAdjacentHTML("beforeend",slotInput(k,""));box.querySelector('[data-slot="'+k+'"]').focus();break}
    case "metaEdit":S.editMeta=true;render(true);break;
    case "afv":hojaAfv();break;
    case "ctrlMas":if(p){CTRLMAS[p.slot]=ctrlVisibles(p)+1;render(true);}break;
    case "afvNew":hojaGuardarAfv();break;
    case "afvSave":{const nm=$("afvName").value.trim();const b=p&&p.blocks.find(x=>x.mod===SELB);if(!nm){toast("Escribe la afinación");break}
      AFV[nm]={mod:b.mod,code:b.code,vals:b.vals.slice(),from:p.slot+" "+p.name};guardarAfv();$("sheet").innerHTML="";toast("Afinación virtual «"+nm+"» guardada");break}
    case "titles":TITULOS=!TITULOS;try{localStorage.setItem("rs_m_titles",TITULOS?"1":"0")}catch(e){}render(true);break;
    case "metaDone":S.editMeta=false;render(true);break;
    case "help":go("ayuda");break;
    case "sheetClose":$("sheet").innerHTML="";break;
    case "theme":{const h=document.documentElement,dk=getComputedStyle(h).colorScheme.indexOf("dark")>=0;h.setAttribute("data-theme",dk?"light":"dark");try{localStorage.setItem("rs_m_theme",dk?"light":"dark")}catch(e){}break}
  }
});

/* parámetros: mismo manejo que la tabla de escritorio, Sync incluido */
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="pq"){S.pq=t.value;render(true);return}
  if(t.id==="tq"){S.tq=t.value;S.open=-1;render(true);return}
  if(t.id==="qs"){pintarBuscar(t.value);return}
  if(t.id==="mName"){const p=PRESETS[CUR];if(p){const viejo=getNote(p);const nv=t.value;if(viejo&&!NOTES[nv.trim()]){setNote(p,"");p.name=nv;setNote(p,viejo);}else p.name=nv;p.dirty=true;}return}
  if(t.id==="mNote"){const p=PRESETS[CUR];if(p){p.note=t.value;p.dirty=true;}return}
  if(t.id==="mAuthor"){const p=PRESETS[CUR];if(p){p.author=t.value;p.dirty=true;p.kind=p.author?"mio":(isEmpty(p)?"vacio":"sinfirmar");}return}
  if(t.dataset.par===undefined||t.tagName==="SELECT")return;
  cambiarParam(t,false);
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="filePrst"){abrirPrst(t.files);t.value="";return}
  if(t.id==="mStyle"){const p=PRESETS[CUR];if(p){p.style=+t.value;p.dirty=true;}return}
  if(t.id==="fileJson"){const f=t.files[0];t.value="";if(f)f.text().then(importarComentarios);return}
  if(t.id==="fileCsv"){const f=t.files[0];t.value="";if(f)f.text().then(importarTemas);return}
  if(t.id==="mdl"){
    const p=PRESETS[CUR],b=p&&p.blocks.find(x=>x.mod===SELB);if(!b)return;
    b.code=+t.value;b.fx=FX[String(b.code)]||null;b.vals=new Array(15).fill(0);
    if(b.fx)b.fx.p.forEach(d=>b.vals[d.i]=d.d);
    p.dirty=true;
    if(esActivo(p)&&b.fx)b.fx.p.forEach(d=>aplicarParam(p,b.mod,d.i,b.vals[d.i]));
    render(true);toast("El cambio de modelo se oye al guardar en el pedal");return;
  }
  if(t.dataset.par!==undefined&&t.tagName==="SELECT")cambiarParam(t,true);
  if(t.dataset.par!==undefined&&t.type==="range")render(true);
});
function cambiarParam(t,redibujar){
  const p=PRESETS[CUR],b=p&&p.blocks.find(x=>x.mod===SELB);if(!b)return;
  const pi=+t.dataset.par,def=(b.fx?b.fx.p:[]).find(d=>d.i===pi),v=parseFloat(t.value);
  if(!isFinite(v))return;
  if(t.dataset.sync){b.vals[pi]=v;p.dirty=true;aplicarParam(p,b.mod,pi,v);if(redibujar)render(true);return}
  if(def&&(v<def.mn||v>def.mx))return;
  b.vals[pi]=v;p.dirty=true;aplicarParam(p,b.mod,pi,v);
  const out=$("v"+t.id);if(out&&def)out.textContent=fmt(v)+(def.u?" "+def.u:"");
  const dep=(b.fx?b.fx.p:[]).filter(q=>q.y===pi);
  for(const q of dep){const w=b.vals[q.i];
    if(divSync(b,q)){if(!(Number.isInteger(w)&&w>=0&&w<SYNC_DIV.length))b.vals[q.i]=SYNC_DEF;}
    else if(v<0.5&&(w<q.mn||w>q.mx))b.vals[q.i]=q.d;
    if(b.vals[q.i]!==w)aplicarParam(p,b.mod,q.i,b.vals[q.i]);}
  if(redibujar||dep.length)render(true);
  else{const badge=document.querySelector(".badge.dirty");if(!badge)render(true);}
}

window.addEventListener("hashchange",()=>{window.scrollTo(0,0);S.editNote=false;S.editMeta=false;render()});
window.addEventListener("beforeunload",e=>{if(dirtyN()){e.preventDefault();e.returnValue=""}});
try{const th=localStorage.getItem("rs_m_theme");if(th)document.documentElement.setAttribute("data-theme",th)}catch(e){}
render();
</script>
